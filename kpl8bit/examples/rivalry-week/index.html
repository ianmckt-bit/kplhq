<!doctype html>
<html><head><meta charset="utf-8"><title>KPL Rivalry Week</title>
<style>

:root{--bg:#140904;--panel:#24120a;--edge:#5a2a14;--A:#f5b400;--B:#ff6a3d;--cream:#f7e6c4;--dim:#a8805e;--ink:#c4302b;--shadow:#3a1606}

[data-logo=r]{background-position:98.1947% 34.795%}[data-logo=t]{background-position:98.1947% 44.1373%}[data-logo=v]{background-position:98.1947% 53.3842%}[data-logo=m]{background-position:98.1947% 62.6311%}[data-logo=w]{background-position:98.1947% 71.9733%}[data-logo=s]{background-position:98.1947% 81.2202%}
[data-logo=league],[data-logo=h],[data-logo=k]{background-image:url(../../assets/logos/spriteB.png)}

[data-logo=h]{background-size:299.4152% 498.7013%;background-position:8.5044% 28.013%;aspect-ratio:342/308}
[data-logo=k]{background-size:290.9091% 478.5047%;background-position:91.369% 27.4897%;aspect-ratio:352/321}
#top{position:absolute;left:0;right:0;top:0;height:64px;background:#0d0603;border-bottom:4px solid var(--B);display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:30px;z-index:30}
#src{position:absolute;left:0;right:0;top:1018px;text-align:center;font-size:18px;color:var(--dim);z-index:30;letter-spacing:.04em}

.row{position:absolute;left:160px;width:1600px;height:68px;border:4px solid var(--edge);border-radius:8px;background:rgba(40,18,8,.82);display:flex;align-items:center;padding:0 12px;gap:18px}
.row .nmA{flex:1;font-size:34px;color:var(--A);text-shadow:4px 4px 0 var(--shadow)}
.row .nmB{flex:1;font-size:34px;color:var(--B);text-align:right;text-shadow:4px 4px 0 var(--shadow)}

.blk{position:absolute;height:40px;border-radius:2px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.yr{position:absolute;font-size:22px;color:var(--cream);text-align:center;width:124px}
.tape{position:absolute;left:66px;width:880px;height:60px;display:flex;align-items:center}

.vign{position:absolute;inset:0;z-index:59;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
</style></head>
<body>
<canvas id="bg" width="1920" height="1080"></canvas>
<div id="stage">
  <div id="top"><span id="topL">KPL - KEANSBURG PREMIER LEAGUE</span><span id="topR" style="color:#e9c89a">2026 SEASON</span></div>
  <div class="scene" id="I">
    <canvas id="sun" width="1920" height="600" style="top:150px"></canvas>
    <div class="abs c big" id="I1" style="top:96px;left:0;width:1920px;font-size:132px;color:var(--cream)">RIVALRY</div>

    <div class="abs A sh" id="nA" style="left:72px;top:442px;font-size:34px"></div>

    <div class="abs" id="rA" style="left:76px;top:500px;font-size:26px"></div>

    <div class="abs A" id="sA" style="right:1010px;top:160px;font-size:132px;text-shadow:6px 6px 0 var(--shadow);transform-origin:right center">0</div>

    <div class="panel" id="pT" style="left:66px;top:634px;width:880px;height:352px"><div class="abs c dim" style="left:0;width:872px;top:36px;font-size:24px;letter-spacing:.16em">TALE OF THE TAPE</div></div>
    <div id="tape"></div>
    <div class="panel" id="pM" style="left:978px;top:634px;width:880px;height:352px"><div class="abs c dim" style="left:0;width:872px;top:36px;font-size:24px;letter-spacing:.16em">WINNING MARGIN</div></div>
    <canvas id="chart" width="1920" height="1080"></canvas>
    <div id="mlabs"></div>
    <div class="tag" id="pf" style="display:none"></div>
  </div>
  <div class="scene" id="O">
    <canvas id="sun2" width="1920" height="600" style="top:240px"></canvas>
    <span class="logo abs" data-logo="league" id="Ologo" style="left:860px;top:150px;width:200px"></span>
    <div class="abs c big" id="O1" style="top:420px;left:0;width:1920px;font-size:84px;color:var(--A)">6 RIVALRIES</div>
    <div class="abs c sh" id="O2" style="top:550px;left:0;width:1920px;font-size:40px">ONE WEEK. NEW CHAPTERS.</div>
    <div class="abs c sh" id="O3" style="top:680px;left:0;width:1920px;font-size:34px;color:var(--B)">FOLLOW LIVE ON KPL HQ</div>
    <div class="abs c dim" id="O4" style="top:750px;left:0;width:1920px;font-size:24px">KPLHQ.KPLREDZONE.WORKERS.DEV</div>
  </div>
  <div id="src">FLAIM/ESPN - KPL REG SEASON WKS 1-12, 2018-2026 - BY ESPN TEAM SLOT</div>
</div>
<canvas id="fx" width="1920" height="1080" style="z-index:45"></canvas>
<div id="flash"></div><div class="vign"></div><div class="scan"></div>
<script>
let D;const $=s=>document.getElementById(s);
const cl=x=>Math.max(0,Math.min(1,x)),P=(t,a,b)=>cl((t-a)/(b-a));
const oc=x=>1-Math.pow(1-x,3),io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,sine=x=>-(Math.cos(Math.PI*x)-1)/2;
const spr=x=>x<=0?0:x>=1?1:1-Math.exp(-6.5*x)*Math.cos(8.5*x);
const set=(id,css)=>Object.assign((typeof id==='string'?$(id):id).style,css);
function fin(el,u,a,d=.7,dy=50,dx=0){const x=P(u,a,a+d),e=spr(x),E=typeof el==='string'?$(el):el;E.style.opacity=Math.min(1,x*2.4);E.style.transform=`translate(${(1-e)*dx}px,${(1-e)*dy}px)`}
// ---------- timeline ----------
const MD=8.4;let TL=[];function buildTL(){TL=[['I',0,6.0]];D.matches.forEach((m,i)=>TL.push(['M'+i,6.0+i*MD,6.0+(i+1)*MD]));const e=TL[TL.length-1][2];TL.push(['O',e,e+4.0])}
// ---------- background: drifting checkerboard + bottom sunset stripes ----------
function bg(t){const c=$('bg').getContext('2d');c.fillStyle='#140904';c.fillRect(0,0,1920,1080);const S=64,o=(t*12)%(S*2);
  for(let y=-S*2;y<1080;y+=S)for(let x=-S*2;x<1920;x+=S){if(((x+y)/S)%2===0){c.fillStyle='#1d0e07';c.fillRect(x+o,y+o*.5,S,S)}}
  const g=c.createRadialGradient(960,540,100,960,540,1100);g.addColorStop(0,'rgba(255,106,61,.10)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,1920,1080);
  const cols=['#ff6a3d','#c4302b','#f5b400','#ff8a1f'];for(let i=0;i<4;i++){c.fillStyle=cols[i];c.fillRect(0,1050+i*8,1920,8)}
  c.fillStyle='rgba(0,0,0,.35)';for(let x=-(t*80%40);x<1920;x+=40)c.fillRect(x,1050,4,30)}
// pixel synthwave sun with horizontal cut lines
function sun(cv,u,cy=330,R=230){const c=cv.getContext('2d');c.clearRect(0,0,1920,600);const rise=(1-oc(P(u,0,1.2)))*260;const st=10;
  for(let y=-R;y<=0;y+=st){const w=Math.sqrt(R*R-y*y),k=(y+R)/R;const col=k<.35?'#7a1c10':k<.6?'#c4302b':k<.8?'#ff6a3d':'#f5b400';const gap=(y>-R*.55)?Math.round(2+((y+R*.55)/(R*.55))*6):0;
    c.fillStyle=col;c.globalAlpha=.85;c.fillRect(Math.round(960-w),Math.round(cy+y+rise),Math.round(w*2),st-gap)}
  c.globalAlpha=1;for(let i=0;i<6;i++){c.fillStyle=['#f5b400','#ff6a3d','#c4302b'][i%3];c.globalAlpha=.6-i*.08;const w=440-i*14;c.fillRect(960-w/2,cy+20+i*12+rise*.4,w,6)}c.globalAlpha=1}
// ---------- intro ----------
function buildI(){$('Irows').innerHTML=D.matches.map((m,i)=>`<div class="row" id="ir${i}" style="top:${515+i*80}px"><span class="logo" data-logo="${m.logoA}"></span><span class="nmA">${m.shortA}</span><span class="vs" id="iv${i}">VS</span><span class="nmB">${m.shortB}</span><span class="logo" data-logo="${m.logoB}"></span></div>`).join('')}
function renderI(u){sun($('sun'),u);fin('I1',u,.1,.8,-60);fin('I2',u,.3,.8,-60);fin('I3',u,.7,.7,30);
  D.matches.forEach((m,i)=>{fin('ir'+i,u,1.2+i*.14,.8,0,i%2?160:-160);const v=$('iv'+i);const sw=u>3.4+i*.12;v.textContent=sw?`${m.wins[0]}-${m.wins[1]}`:'VS';
    v.style.color=sw?(m.wins[0]>m.wins[1]?'var(--A)':m.wins[0]<m.wins[1]?'var(--B)':'var(--cream)'):'var(--cream)';v.style.textShadow=sw?`0 0 ${10+8*Math.sin(u*5+i)}px currentColor,4px 4px 0 #3a1606`:'4px 4px 0 #3a1606'})}
// ---------- match card ----------
let built=-1,M,blkT=[],chartT=[],big=-1,close=-1,mx=1;
function short(m,s){return s==='A'?m.tagA:m.tagB}
function streakText(m){const s=m.streak;const who=short(m,s.team);return s.n>=2?`${who} - ${s.n} IN A ROW`:`${who} WON LAST TIME`}
function buildM(i){M=D.matches[i];const n=M.games.length;
  $('topL').textContent='KPL RIVALRY WEEK 12';$('topR').textContent=`MATCH ${i+1}/${D.matches.length}`;$('topR').style.color='var(--A)';
  $('lA').dataset.logo=M.logoA;$('lB').dataset.logo=M.logoB;$('nA').textContent=M.shortA;$('nB').textContent=M.shortB;$('rA').textContent='2026  '+M.recA;$('rB').textContent='2026  '+M.recB;
  const st=$('streak');st.textContent=streakText(M);st.style.background=M.streak.team==='A'?'var(--A)':'var(--B)';
  const W=124,G=12,x0=960-(n*W+(n-1)*G)/2;let h='';
  M.games.forEach((g,k)=>{h+=`<div class="blk" id="bk${k}" style="left:${x0+k*(W+G)}px;top:536px;width:${W}px;background:${g.w==='A'?'#f5b400':'#ff6a3d'}"></div><div class="yr" id="yr${k}" style="left:${x0+k*(W+G)}px;top:598px">'${String(g.y%100).padStart(2,'0')}</div>`});$('tl').innerHTML=h;
  blkT=M.games.map((g,k)=>1.3+k*Math.min(.24,2.5/n));
  const L=M.last,f1=v=>v==null?'-':v.toFixed(1);
  const rows=[['AVG SCORE',M.avgA,M.avgB,''],['BEST WIN',M.bestA,M.bestB,'+'],[`LAST '${String(L.y%100).padStart(2,'0')} W${L.wk}`,L.a,L.b,''],['WK 12 PROJ',M.projA,M.projB,'']];
  $('tape').innerHTML=rows.map((r,k)=>`<div class="tape" id="tp${k}" style="top:${700+k*64}px"><span class="a" data-v="${r[1]}" data-p="${r[3]}">0.0</span><span class="l">${r[0]}</span><span class="b" data-v="${r[2]}" data-p="${r[3]}">0.0</span></div>`).join('');
  mx=Math.max(...M.games.map(g=>g.m));const slot=68;const cx0=1418-n*slot/2;chartT=M.games.map((g,k)=>4.6+k*.16);
  big=M.games.reduce((b,g,k)=>g.m>=60&&(b<0||g.m>M.games[b].m)?k:b,-1);close=M.games.reduce((b,g,k)=>g.m<3&&(b<0||g.m<M.games[b].m)?k:b,-1);
  $('mlabs').innerHTML=M.games.map((g,k)=>{const hgt=Math.max(6,100*g.m/mx),x=cx0+k*slot+slot/2;return `<div class="mlab" id="ml${k}" style="left:${x-40}px;top:${g.w==='A'?844-hgt-34:844+hgt+12}px">${Math.round(g.m)}</div>`}).join('');
  M._cx0=cx0;M._slot=slot}
function chart(u){const c=$('chart').getContext('2d');c.clearRect(0,0,1920,1080);const a=P(u,4.2,4.6);if(a<=0)return;
  c.globalAlpha=a;c.fillStyle='#8a6a4e';c.fillRect(1000,842,836,4);c.globalAlpha=1;
  M.games.forEach((g,k)=>{const p=spr(P(u,chartT[k],chartT[k]+.6));if(p<=0)return;const hgt=Math.max(6,100*g.m/mx)*p,x=M._cx0+k*M._slot+4,w=M._slot-8,col=g.w==='A'?'#f5b400':'#ff6a3d';
    c.shadowColor=col;c.shadowBlur=18+10*Math.sin(u*4+k);c.fillStyle=col;if(g.w==='A')c.fillRect(x,842-hgt,w,hgt);else c.fillRect(x,846,w,hgt);c.shadowBlur=0;
    c.fillStyle='rgba(255,255,255,.35)';if(g.w==='A')c.fillRect(x,842-hgt,w,6);else c.fillRect(x,846+hgt-6,w,6)})}
// rising pixel embers above the streak blocks
function fire(u){const c=$('fire').getContext('2d');c.clearRect(0,0,1920,1080);const s=M.streak;if(s.n<3)return;const a=P(u,blkT[blkT.length-1]+.4,blkT[blkT.length-1]+.9);if(a<=0)return;
  const n=M.games.length,first=n-s.n,b0=$('bk'+first),b1=$('bk'+(n-1)),x0=parseFloat(b0.style.left),x1=parseFloat(b1.style.left)+124;const col=s.team==='A'?['#f5b400','#ffe58a','#ff6a3d']:['#ff6a3d','#ffb07a','#c4302b'];
  for(let i=0;i<70;i++){const life=((u*0.9+i*0.137)%1),x=x0+((i*97.3)%(x1-x0))+Math.sin(u*3+i)*8,y=536-life*130;c.globalAlpha=a*(1-life);c.fillStyle=col[i%3];const z=(i%3+2)*3;c.fillRect(Math.round(x/3)*3,Math.round(y/3)*3,z,z)}
  c.globalAlpha=a*.35;const g=c.createLinearGradient(0,470,0,580);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,col[0]);c.fillStyle=g;c.fillRect(x0-10,470,x1-x0+20,110);c.globalAlpha=1}
function renderM(u){
  // logos fly in, names, records
  const a=spr(P(u,.25,1.05)),b=spr(P(u,.35,1.15));set('fA',{transform:`translateX(${(1-a)*-520}px) rotate(${(1-a)*-12}deg)`,opacity:P(u,.25,.5)});set('fB',{transform:`translateX(${(1-b)*520}px) rotate(${(1-b)*12}deg)`,opacity:P(u,.35,.6)});
  fin('nA',u,.8,.7,30);fin('nB',u,.9,.7,30);fin('rA',u,1.0,.6,20);fin('rB',u,1.1,.6,20);fin('kLab',u,.5,.6,-20);fin('sA',u,.7,.6,-30);fin('sB',u,.75,.6,-30);fin('sDot',u,.8,.5,0);
  set('vs',{transform:`scale(${spr(P(u,.9,1.5))})`});
  // timeline blocks light in order; the winner's score pops
  let wa=0,wb=0,lastA=-9,lastB=-9;M.games.forEach((g,k)=>{const p=P(u,blkT[k],blkT[k]+.25),el=$('bk'+k),yr=$('yr'+k);el.style.opacity=p>0?1:0;el.style.transform=`scaleY(${spr(p)})`;
    el.style.boxShadow=p>0?`0 0 ${12+(1-p)*30}px ${g.w==='A'?'#f5b400':'#ff6a3d'},inset 0 -6px 0 rgba(0,0,0,.25)`:'none';yr.style.opacity=P(u,blkT[k]+.05,blkT[k]+.3);
    if(u>=blkT[k]){if(g.w==='A'){wa++;lastA=blkT[k]}else{wb++;lastB=blkT[k]}}});
  $('sA').textContent=wa;$('sB').textContent=wb;
  const pa=P(u,lastA,lastA+.35),pb=P(u,lastB,lastB+.35);
  $('sA').style.transform+=` scale(${1+.35*(1-oc(pa))*(pa>0&&pa<1)})`;$('sB').style.transform+=` scale(${1+.35*(1-oc(pb))*(pb>0&&pb<1)})`;
  const done=u>blkT[blkT.length-1]+.3,lead=M.wins[0]-M.wins[1],tied=lead===0;
  $('sA').style.textShadow=`6px 6px 0 #3a1606,0 0 ${(pa<1&&pa>0?40:0)+(done&&(lead>0||tied)?16+10*Math.sin(u*4):0)}px #f5b400`;
  $('sB').style.textShadow=`6px 6px 0 #3a1606,0 0 ${(pb<1&&pb>0?40:0)+(done&&(lead<0||tied)?16+10*Math.sin(u*4):0)}px #ff6a3d`;
  $('kLab').textContent=done&&tied?'ALL SQUARE':'KPL-ERA SERIES';$('kLab').style.color=done&&tied?'var(--cream)':'var(--dim)';$('kLab').style.textShadow=done&&tied?`0 0 ${14+10*Math.sin(u*6)}px #f7e6c4`:'none';
  // leader's frame glows (dominance)
  const glow=(on,col)=>on?`0 0 ${20+14*Math.sin(u*3)}px ${col},0 0 ${50+20*Math.sin(u*3)}px ${col}55`:'none';
  $('fA').style.boxShadow=glow(done&&lead>=3,'#f5b400');$('fB').style.boxShadow=glow(done&&lead<=-3,'#ff6a3d');
  // streak banner
  const sb=$('streak'),bt=blkT[blkT.length-1]+.45,s=spr(P(u,bt,bt+.6));sb.style.opacity=P(u,bt,bt+.15);sb.style.transform=`scale(${.4+.6*s})`;

    pf.style.left=Math.min(1560,Math.max(360,bx-150))+'px';pf.style.top='484px';pf.style.opacity=(u<chartT[close]+1.1&&Math.floor(u*16)%2)?.35:1;pf.style.background=g.w==='A'?'#f5b400':'#ff6a3d';
    const pulse=`0 0 0 4px rgba(247,230,196,${.5+.5*Math.sin(u*8)}),0 0 24px #f7e6c4`;bk.style.boxShadow=pulse;
    const c=$('chart').getContext('2d'),x=M._cx0+close*M._slot+2,h=Math.max(6,100*g.m/mx)+8;c.strokeStyle=`rgba(247,230,196,${.5+.5*Math.sin(u*8)})`;c.lineWidth=4;c.strokeRect(x,g.w==='A'?842-h+4:842,M._slot-4,h)}else pf.style.display='none'}
function impact(t){// blowout bar lands: shake + flash + RGB split
  let k=0;for(const s of TL){if(!s[0].startsWith('M'))continue;const m=D.matches[+s[0].slice(1)];const bi=m.games.reduce((b,g,j)=>g.m>=60&&(b<0||g.m>m.games[b].m)?j:b,-1);if(bi<0)continue;
    const T=s[1]+4.6+bi*.16+.25,d=t-T;if(d>=0&&d<.45)k=Math.max(k,1-d/.45)}

  $('stage').style.filter=k>.3?`drop-shadow(${6*k}px 0 0 rgba(255,40,40,.55)) drop-shadow(${-6*k}px 0 0 rgba(40,220,255,.45))`:'none';return k}
